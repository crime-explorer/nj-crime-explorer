name: Update NJ Crime Data

on:
  schedule:
    - cron: "0 6 1 * *"   # Runs monthly on the 1st at 06:00 UTC
  workflow_dispatch:       # Adds a "Run workflow" button in GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest NJ crime data
        env:
          FBI_API_KEY: ${{ secrets.FBI_API_KEY }}
        run: python3 scripts/update_data.py

      - name: Commit updated data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "chore: update NJ crime data" && git push)
